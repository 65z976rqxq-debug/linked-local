version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: wellness
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d wellness || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./local-backend
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgres://dev:dev@db:5432/wellness
      - PORT=4000
      - FRONTEND_ORIGINS=http://localhost:5173,http://localhost:8080
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 6
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://backend:4000
    ports:
      - "5173:5173"
    depends_on:
      - backend

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  db_data:
