<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Debug - Linked Local</title>
  </head>
  <body>
    <h1>Debug page</h1>
    <div id="out">loading...</div>
    <script>
      fetch('/api/')
        .then(r => r.json())
        .then(j => { document.getElementById('out').textContent = JSON.stringify(j); })
        .catch(e => { document.getElementById('out').textContent = 'error: ' + e; });
    </script>
  </body>
</html>
